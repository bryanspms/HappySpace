<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Happy Space remote</title>
  <style>
    body { font: 1.1rem system-ui, sans-serif; max-width: 32rem; margin: auto; padding: 1rem; background: #f3f8f8; color: #123; }
    h1 { font-size: 1.6rem; }
    input, button { font: inherit; padding: .8rem; box-sizing: border-box; }
    input { width: 100%; margin: .5rem 0; }
    button { border: 0; border-radius: .4rem; background: #176466; color: white; cursor: pointer; }
    button:disabled { opacity: .5; }
    .controls { display: grid; grid-template-columns: 1fr 1fr; gap: .6rem; margin-top: 1rem; }
    #status { min-height: 3em; }
  </style>
</head>
<body>
  <h1>Happy Space remote</h1>
  <form id="login">
    <label for="password">Remote password</label>
    <input id="password" type="password" autocomplete="current-password" required>
    <button type="submit">Connect</button>
  </form>
  <p id="status" role="status" aria-live="polite">Enter the remote password to connect.</p>
  <div class="controls">
    <button data-command="live" disabled>Live video</button>
    <button data-command="calming" disabled>Fish tank</button>
    <button data-command="demo-on" disabled>Demo on</button>
    <button data-command="demo-off" disabled>Demo off</button>
  </div>
  <p>Demo mode simulates breaks; it does not detect commercials.</p>
  <script>
    let password = "";
    const status = document.getElementById("status");
    const buttons = document.querySelectorAll("[data-command]");
    function enabled(value) { buttons.forEach(button => button.disabled = !value); }
    async function request(path, options = {}) {
      const response = await fetch(path, {
        ...options,
        headers: { ...options.headers, Authorization: "Bearer " + password },
        cache: "no-store"
      });
      if (!response.ok) {
        const detail = await response.json();
        throw new Error(detail.error || "Request failed");
      }
      return response.json();
    }
    async function refresh() {
      if (!password) return;
      try {
        const state = await request("/api/status");
        if (state.age_seconds > 5) throw new Error("App is not updating");
        status.textContent = `Connected: ${state.selection === "live" ? "live video" : "fish tank"}; demo ${state.demo ? "on" : "off"}.`;
        enabled(true);
      } catch (error) {
        status.textContent = `Disconnected: ${error.message}`;
        enabled(false);
      }
    }
    document.getElementById("login").addEventListener("submit", event => {
      event.preventDefault();
      password = document.getElementById("password").value;
      document.getElementById("password").value = "";
      refresh();
    });
    buttons.forEach(button => button.addEventListener("click", async () => {
      enabled(false);
      try {
        await request("/api/command", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ command: button.dataset.command })
        });
        status.textContent = "Command sent; waiting for the app.";
      } catch (error) {
        status.textContent = `Command failed: ${error.message}`;
      }
      setTimeout(refresh, 300);
    }));
    setInterval(refresh, 2000);
  </script>
</body>
</html>
