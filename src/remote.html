<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Happy Space remote</title>
  <link rel="icon" type="image/png" href="/happy-space-icon.png">
  <link rel="apple-touch-icon" href="/happy-space-icon.png">
  <style>
    body { font: 1.1rem system-ui, sans-serif; max-width: 32rem; margin: auto; padding: 1rem; background: #f3f8f8; color: #123; }
    h1 { font-size: 1.6rem; }
    .brand { display: flex; align-items: center; gap: .8rem; }
    .brand img { width: 72px; height: 72px; border-radius: .5rem; }
    input, button, select { font: inherit; padding: .8rem; box-sizing: border-box; }
    input, select { width: 100%; margin: .5rem 0; }
    button { border: 0; border-radius: .4rem; background: #176466; color: white; cursor: pointer; }
    button:disabled { opacity: .5; }
    .controls { display: grid; grid-template-columns: 1fr 1fr; gap: .6rem; margin-top: 1rem; }
    #status { min-height: 3em; }
  </style>
</head>
<body>
  <header class="brand">
    <img src="/happy-space-logo.png" alt="" width="72" height="72">
    <h1>Happy Space remote</h1>
  </header>
  <form id="login">
    <label for="password">Remote password</label>
    <input id="password" type="password" autocomplete="current-password" required>
    <button type="submit">Connect</button>
  </form>
  <p id="status" role="status" aria-live="polite">Enter the remote password to connect.</p>
  <div id="remote-view">
  <div class="controls">
    <button data-command="live" disabled>Live video</button>
    <button data-command="calming" disabled>Calming video</button>
    <button data-command="demo-on" disabled>Demo on</button>
    <button data-command="demo-off" disabled>Demo off</button>
  </div>
  <p>Demo mode simulates breaks; it does not detect commercials.</p>
  <button id="open-settings" disabled>Setup</button>
  </div>
  <section id="settings-view" hidden>
    <h2>Setup</h2>
    <form id="settings-form">
      <label for="video-choice">Calming video</label>
      <select id="video-choice" required></select>
      <p>Random mode chooses a video each time one finishes.</p>
      <button id="save-settings" type="submit" disabled>Save settings</button>
    </form>
    <p id="settings-status" role="status" aria-live="polite"></p>
    <button id="close-settings" type="button">Back to remote</button>
  </section>
  <script>
    let password = "";
    const status = document.getElementById("status");
    const buttons = document.querySelectorAll("[data-command]");
    const setup = document.getElementById("open-settings");
    const save = document.getElementById("save-settings");
    const choices = document.getElementById("video-choice");
    const settingsStatus = document.getElementById("settings-status");
    let settingsLoaded = false;
    let connected = false;
    let saving = false;
    function enabled(value) {
      connected = value;
      buttons.forEach(button => button.disabled = !value);
      setup.disabled = !value;
      save.disabled = !value || !settingsLoaded || saving;
    }
    async function request(path, options = {}) {
      const response = await fetch(path, {
        ...options,
        headers: { ...options.headers, Authorization: "Bearer " + password },
        cache: "no-store"
      });
      if (!response.ok) {
        const detail = await response.json();
        throw new Error(detail.error || "Request failed");
      }
      return response.json();
    }
    async function refresh() {
      if (!password) return;
      try {
        const state = await request("/api/status");
        if (state.age_seconds > 5) throw new Error("App is not updating");
        status.textContent = `Connected: ${state.selection === "live" ? "live video" : "calming video"}; demo ${state.demo ? "on" : "off"}.`;
        enabled(true);
      } catch (error) {
        status.textContent = `Disconnected: ${error.message}`;
        enabled(false);
      }
    }
    document.getElementById("login").addEventListener("submit", event => {
      event.preventDefault();
      password = document.getElementById("password").value;
      document.getElementById("password").value = "";
      refresh();
    });
    buttons.forEach(button => button.addEventListener("click", async () => {
      enabled(false);
      try {
        await request("/api/command", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ command: button.dataset.command })
        });
        status.textContent = "Command sent; waiting for the app.";
      } catch (error) {
        status.textContent = `Command failed: ${error.message}`;
      }
      setTimeout(refresh, 300);
    }));
    setup.addEventListener("click", async () => {
      document.getElementById("remote-view").hidden = true;
      document.getElementById("settings-view").hidden = false;
      settingsLoaded = false;
      save.disabled = true;
      settingsStatus.textContent = "Loading settings…";
      try {
        const settings = await request("/api/settings");
        choices.replaceChildren();
        if (settings.video.mode === "default") {
          choices.add(new Option("Current config file video", "default", true, true));
          choices.options[0].disabled = true;
        }
        choices.add(new Option("Random video", "random"));
        settings.videos.forEach(name => choices.add(new Option(name, "file:" + name)));
        if (settings.video.mode === "random") choices.value = "random";
        if (settings.video.mode === "file") choices.value = "file:" + settings.video.file;
        settingsLoaded = true;
        save.disabled = !connected || saving;
        settingsStatus.textContent = "";
      } catch (error) {
        settingsStatus.textContent = `Could not load settings: ${error.message}`;
      }
    });
    document.getElementById("close-settings").addEventListener("click", () => {
      document.getElementById("settings-view").hidden = true;
      document.getElementById("remote-view").hidden = false;
    });
    document.getElementById("settings-form").addEventListener("submit", async event => {
      event.preventDefault();
      const value = choices.value;
      if (value === "default") {
        settingsStatus.textContent = "Choose a video or random mode.";
        return;
      }
      const choice = value === "random" ? { mode: "random" } : { mode: "file", file: value.slice(5) };
      saving = true;
      save.disabled = true;
      try {
        await request("/api/settings", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(choice)
        });
        settingsStatus.textContent = "Settings saved. The app will apply them shortly.";
      } catch (error) {
        settingsStatus.textContent = `Could not save settings: ${error.message}`;
      }
      saving = false;
      save.disabled = !connected || !settingsLoaded;
    });
    setInterval(refresh, 2000);
  </script>
</body>
</html>
